      scoring_rule: str (object/category) - {exact_match,unit_tests,judge_rubric,numeric_tol}
      difficulty: str (object/category) - optional difficulty stratum
      is_held_out: bool (bool) - MANDATORY True (eval disjoint from qual, A1)
    example:
