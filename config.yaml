preprocessing:
  qualification_threshold_pct: 0.8
  stratify_by:
  - family
  - param_scale
  - capability_cluster
  param_scale_bins:
    small: <20B
    medium: 20B-70B
    large: '>70B'
  n_capability_clusters: 4
  held_out_disjoint_check: true
  cost_per_token:
    input: from_provider
    output: from_provider
architecture:
  trains_neural_network: false
  constituent_model_type: pretrained_frozen_black_box_decoder_only_transformer
  orchestration_subsystems:
  - expert_models
  - fusion_operator
  - fmec_estimation_and_selection
  - optional_learned_router
  fusion_operator: verifier_augmented
  weighted_fusion_exponents:
    a: 0.5
    b: 0.25
  sandbox:
    timeout_s: 5
    network: disabled
    fs: restricted
  single_learnable_component: epsilon_greedy_contextual_bandit_router
network_training:
  gradient_training_used: false
  gradient_hyperparameters: null
  router:
    enabled: false
    policy: epsilon_greedy
    epsilon: 0.1
    reward_weights:
      lambda: 0.5
      mu: 0.02
      gamma: 0.0
    context_features:
    - coding
    - text
    - quant
    - general
    online_update_rule: 'incremental_sample_mean: m <- m + (r - m)/n'
    seed: 20260618
estimation:
  utility_weights:
    alpha: 1.0
    beta: 0.5
    gamma: 0.3
    delta: 0.2
  fmec_hyperparams:
    eta: 0.75
    lambda: 0.6
  monte_carlo:
    K: 512
    coalition_sampler: permutation
    size_mixture_weights: null
    sampling_seed: 20260618
  information_gain:
    estimator: outcome_based_cmi
    discretization: correctness_indicator
    conditioning: correct_count_sufficient_statistic
    smoothing: laplace
    smoothing_alpha: 0.5
    miller_madow_correction: true
  covariance:
    estimator: ledoit_wolf
    shrinkage_target: diagonal
    block_by_error_category: true
  reference_weight_w: null
optimization:
  C_max: 0.02
  L_max: 4.0
  R_max: 0.08
  weight_simplex: true
  selection: greedy_budget_feasible
uncertainty:
  replication:
    R: 5
    adjudication_subsample: 0.2
    R_judge: 5
    replicate_seed_base: 20260618
  bootstrap:
    B: 10000
    interval: BCa
    ci_level: 0.95
    scheme: nested_cluster
    resample_levels:
    - task
    - replicate
    - adjudication
    report_variance_components: true
    bootstrap_seed: 13
stat_tests:
  primary_test: paired_t_or_wilcoxon
  multiple_comparison: holm_bonferroni
  alpha_level: 0.05
  effect_sizes:
  - cohens_d
  - cliffs_delta
  - relative_utility_gain
  robustness_draws: 10000
  robustness_prior: dirichlet_1_1_1_1
  delta_U_rule: cost_tied
  delta_U_floor: 0.02
  delta_tau: 0.2
  rsp_floor: 0.9
  kappa_floor: 0.7
  negligible_d: 0.2
  negligible_cliffs_delta: 0.147
fusion_sim_audit:
  audit_n_coalitions: 200
  stratified_across_coalition_size: true
  report:
  - slope
  - r_squared
  - residual_sd_sigma_u
  per_stratum_tolerance: null
contamination_audit:
  ngram_overlap_n: 13
  overlap_exclusion_rate: 0.1
  canary_probe: true
  report_per_benchmark_per_model: true
  exclusion_rule: drop_item_if_any_model_contaminated
drift_monitor:
  capture_provider_version: true
  capture_system_fingerprint: true
  canary_task_set_size: 100
  recheck_interval_days: 7
  trigger_metric: correctness_rate_shift
  trigger_threshold: 0.03
  embedding_distance_check: true
oracle_eval:
  max_pool_size_for_enumeration: 20
  report:
  - regret
  - relative_regret
  - S_star
plots:
