# ==============================================================================
# config.yaml  --  YAML serialization of STUDY_CONFIG
# Paper: "Beyond Benchmark Rankings: Information-Aware and Risk-Aware Optimization
#        of Large Language Model Ensembles" (CS Chirinda, 2026). Concept/methodology;
#        reports NO results. Example data values are ILLUSTRATIVE PLACEHOLDERS.
#
# Generated programmatically from the exact Python STUDY_CONFIG dict via yaml.dump
# (round-trip verified equal to the source dict). Multi-line prompt strings are
# rendered as literal block scalars ('|') and are VERBATIM Appendix C text.
#
# TRUTHS (do not be misled):
#  1. No neural network is trained (network_training.gradient_training_used: false);
#     the only learnable component is the OPTIONAL bandit router.
#  2. gateway.api_key is null here -- a secret is NEVER serialized; it is loaded at
#     runtime from the env var named in gateway.api_key_env_var (OPENROUTER_API_KEY).
#  3. reproducibility.tensor_sha256, fusion_sim_audit.per_stratum_tolerance, and
#     estimation.reference_weight_w are null: NOT fixed by the manuscript, not invented.
#  4. Per-field provenance comments live in study_config.py; this file carries the
#     DATA plus the methodological_notes block.
# Generated: 2026-06-19
# ==============================================================================

