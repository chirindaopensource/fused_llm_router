methodological_notes:
  no_results_reported: Concept/methodology paper; all example values are illustrative placeholders, never
    measured (§1.4, §12.1).
  no_neural_training: No neural network is trained (§8.1); constituent LLMs are frozen black-box services;
    the only learnable component is the optional bandit router (network_training).
  outcome_tensor_status: The outcomes tensor is the scored output of Stages 1-2 AND the canonical RAW
    INPUT to the estimation pipeline (Stages 3-6); it is the primary released artifact (§9.2, §13.3).
  schema_reconciliation: §10.2 schemas.outcomes_columns lists 13 analytic columns; the released tensor
    (§9.2(d)) adds rep + (provider_version, system_fingerprint, seed).
  error_taxonomy_mapping: Taxonomy labels differ across §3.3 (Eq.2 six base), the §3.3 eight-category
    refinement, the §9.2 e_* columns, and the §11.5/App. C.2 rubric; the eight e_* tensor columns are
    the BINDING contract feeding Sigma.
  prompt_brace_fidelity: 'Prompts are VERBATIM Appendix C (single literal braces in JSON schemas). Fill-tokens:
    {task_prompt}, {reference}, {candidate_answer}, {prompt}, {answers_json}, {json_schema}. Do NOT naively
    str.format(); use safe named substitution.'
  implied_fusion_prompt: prompts.fusion_judge_system is RECONSTRUCTED from §8.3 + App. C.2 (return object
    verbatim); it is NOT printed verbatim in the manuscript.
  undefined_reference_weight_w: 'estimation.reference_weight_w is None: the paper fixes no numeric default
    for the MRC weight vector (Eq. 12).'
  fusion_sim_tolerance_unspecified: 'fusion_sim_audit.per_stratum_tolerance is None: pre-registered in
    principle but no numeric value given (§4.2.1).'
  tensor_hash_to_be_populated: reproducibility.tensor_sha256 is None until the reference instantiation
    is executed (§13.3).
  two_tier_reproducibility: Tier-1 (downstream of the tensor) is bit-exact and deterministic; Tier-2 (re-collection)
    is bounded and instrumented, not exact (§13.3).
  credential_security: No API secret is ever hardcoded or persisted; only the env-var NAME is stored;
    the key is read at runtime (§10).
