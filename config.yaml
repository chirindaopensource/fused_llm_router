  qualification:
    container_type: pd.DataFrame
    grain: one row per candidate model
    schema:
    - model_id
    - family
    - params_b
    - mmlu
    - gpqa
    - humaneval
    - swebench
    - math
    - arena_elo
    - pct_rank
    field_dtypes:
      model_id: (logical str; pandas object/category) primary key; the JOIN KEY to outcomes.model_id.
        Exact gateway id.
      family: (logical str; pandas object/category) architecture/provider genealogy (Gemini, Kimi, DeepSeek,
        Llama, Qwen). A STRATIFICATION AXIS (§11.3) - a proxy for shared pre-training data/tokenizer and
        therefore for correlated errors (the failure geometry Theorem 2 penalizes).
      params_b: '(logical Optional[float], billions; pandas float64 with NaN for closed-weight models)
        CRITICAL DTYPE POINT: the mixed None+int values (e.g., [None, None, None, 70, 72]) realize as
        float64; use nullable Int64 if integer semantics are wanted. A stratification axis, binned via
        preprocessing.param_scale_bins (<20B / 20B-70B / >70B).'
      mmlu: (logical float in [0,1]; pandas float64) public MMLU score (broad knowledge; Hendrycks et
        al., 2021a). A component of pct_rank; pin the benchmark version/source and re-verify hosting at
        use.
      gpqa: (logical float in [0,1]; pandas float64) public GPQA score (graduate-level, search-resistant;
        Rein et al., 2023). Component of pct_rank.
      humaneval: (logical float in [0,1]; pandas float64) public HumanEval score (functional code correctness
        under unit tests; Chen et al., 2021). Component of pct_rank.
      swebench: (logical float in [0,1]; pandas float64) public SWE-bench score (repository-level patch
        synthesis; Jimenez et al., 2024). Component of pct_rank.
      math: (logical float in [0,1]; pandas float64) public MATH score (multi-step symbolic/numeric reasoning;
        Hendrycks et al., 2021b). Component of pct_rank.
      arena_elo: (logical int; pandas int64) human-preference Elo rating (Chatbot Arena / LMArena; Chiang
        et al., 2024). A DIFFERENT SCALE from the [0,1] benchmark columns; record the platform version/date
        since its roster and methodology evolve continuously.
      pct_rank: (logical float in [0,1]; pandas float64) THE composite benchmark percentile and the qualification
        DECISION VARIABLE. A model qualifies iff pct_rank >= P_min (default preprocessing.qualification_threshold_pct
        = 0.80). The only column the gate reads directly; the per-benchmark columns inform how it is composed.
    invariants:
      primary_key: model_id; one row per candidate.
      qualification_rule: qualify iff pct_rank >= preprocessing.qualification_threshold_pct (default 0.80).
      disjointness: qualification ∩ evaluation = ∅; benchmark scores are an eligibility FILTER, never
        the selection objective or the evaluation metric (§3.4).
    structure_note: 'Governed by §9.2(e) and §§11.2-11.3 and intentionally NOT among the analytic ''schemas''
      (it is an eligibility table, not an estimator input). CONTAMINATION CAVEAT (§13.2): these public
      scores are valid for the gate only insofar as the items are absent from a candidate''s pre-training
      data; item-level exclusion is governed by the contamination_audit parameters (a configuration block,
      not this table).'
    example:
      columns:
      - model_id
      - family
      - params_b
      - mmlu
      - gpqa
