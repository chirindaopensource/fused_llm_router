# ==============================================================================
# config.yaml  --  YAML serialization of STUDY_CONFIG  (schemas REVISED)
# Paper: "Beyond Benchmark Rankings: Information-Aware and Risk-Aware Optimization
#        of Large Language Model Ensembles" (CS Chirinda, 2026). Concept/methodology;
#        reports NO results. Example data values are ILLUSTRATIVE PLACEHOLDERS.
#
# Generated programmatically from the exact Python STUDY_CONFIG dict via yaml.dump
# (round-trip verified equal to the source dict). Multi-line strings are literal
# block scalars ('|'); prompt strings are VERBATIM Appendix C text.
#
# THIS REVISION: only raw_data_structures was changed. Each of the five raw schemas
# (model_answer, candidate_solution, task_record, outcomes, qualification) now carries
# container_type, grain, schema, field_dtypes ((logical; pandas) type + semantics +
# invariants), invariants, structure_note, and example. ALL other parameters are
# byte-identical to the prior config.
#
# TRUTHS (unchanged): (1) no neural network is trained; the only learner is the OPTIONAL
# bandit router. (2) gateway.api_key is null here -- a secret is NEVER serialized; loaded
# at runtime from gateway.api_key_env_var. (3) reproducibility.tensor_sha256,
# fusion_sim_audit.per_stratum_tolerance, and estimation.reference_weight_w are null:
# NOT fixed by the manuscript, not invented.
# Generated: 2026-06-19
# ==============================================================================

metadata:
  paper_title: 'Beyond Benchmark Rankings: Information-Aware and Risk-Aware Optimization of Large Language
    Model Ensembles'
  author: CS Chirinda
  paper_date: '2026-06-18'
  paper_type: concept_and_methodology
  results_status: none_reported
  config_purpose: single_run_of_reference_instantiation
gateway:
  base_url: https://openrouter.ai/api/v1
  api_key_env_var: OPENROUTER_API_KEY
  api_key: null
  discover_models_at_runtime: true
models:
  panel:
  - gemini-3-flash
  - kimi-k2.6
  - deepseek-v4-pro
  judge: deepseek-v4-pro
  frontier_baselines:
  - gpt-5.5
  - opus-4.8
  - fable-5
  id_resolution_keywords:
    gemini-3-flash:
    - gemini
    - flash
    kimi-k2.6:
    - kimi
    - k2
    deepseek-v4-pro:
    - deepseek
    - v4
    - pro
llm_settings:
  panel:
    temperature: 0.2
    max_tokens: 1200
    response_format: null
  solver:
    temperature: 0.1
    max_tokens: 2000
    response_format: json_object
  judge:
    temperature: 0.0
    max_tokens: 2000
    response_format: json_object
  request_timeout_s: 60
  max_retries: 2
  parallel_fanout: true
prompts:
  panel_system: |
    You are an expert problem-solver participating in a multi-model panel. You will be
    given a task. Produce your single best, self-contained answer.

    Requirements:
    - Reason carefully and show the key steps of your reasoning before the final answer.
    - Do not assume other panelists' answers; solve the task independently.
    - If the task is verifiable (code, math, structured output), make your final answer
      precise and machine-checkable.
    - Clearly delimit your final answer using the exact markers:
      <final_answer> ... </final_answer>
    - If you are uncertain, state the uncertainty explicitly inside the reasoning; do not
      fabricate facts, citations, APIs, or results.

    Task:
    {task_prompt}
  judge_system: |
    You are a strict, impartial adjudicator. You will be given (1) a task, (2) a reference
    solution or verifiable criterion, and (3) a candidate answer. Judge the candidate
    answer ONLY against the task and the reference/criterion. Do not reward fluency,
    confidence, or verbosity.

    Decision procedure:
    1. Determine whether the candidate answer is CORRECT (fully satisfies the task and
       matches the reference / passes the criterion) or INCORRECT.
    2. If INCORRECT, assign EXACTLY ONE primary error category from this closed set:
       - "factual"            : a verifiably false assertion
       - "reasoning"          : invalid inference from correct premises
       - "arithmetic"         : numerical or symbolic miscalculation
       - "instruction"        : failure to follow explicit constraints or output format
       - "code"               : code that fails tests, raises, or does not compile
       - "hallucination"      : invented citations, APIs, entities, or data
       - "incompleteness"     : truncated or partial answer; dropped sub-questions
       - "safety"             : unwarranted refusal or policy-inappropriate content
    3. Provide a brief, specific justification grounded in the task and reference.
    4. Report a calibrated confidence in [0,1].

    Output requirements:
    - Respond with a SINGLE JSON object and NOTHING else (no prose, no code fences).
    - Conform exactly to this schema:
      {
        "is_correct": <boolean>,
        "error_category": <one of the eight strings above, or null if is_correct is true>,
        "confidence": <number between 0 and 1>,
        "justification": <string, <= 60 words>
      }

    Task:
    {task_prompt}

    Reference / criterion:
    {reference}

    Candidate answer:
    {candidate_answer}
  solver_system: |
    You are an expert solver that returns STRICTLY structured output. Solve the task and
    return your result as a single JSON object conforming exactly to the provided schema.

    Rules:
    - Output ONLY the JSON object; no surrounding prose or code fences.
    - Populate every required field; use null only where the schema permits it.
    - Place any free-form reasoning in the "reasoning" field, not outside the JSON.
    - For code tasks, the "code" field must contain a complete, runnable solution with no
      placeholders.
    - Do not invent values to satisfy the schema; if a value is genuinely unknown, follow
      the schema's null/optional convention and explain in "reasoning".

    Schema:
    {json_schema}

    Task:
    {task_prompt}
  judge_user_template: |
    Original prompt:
    {prompt}

    Candidate answers:
    {answers_json}
  fusion_judge_system: |
    You are a strict, impartial adjudicator selecting the single best answer from a panel.
    You will be given (1) a task and (2) k candidate answers indexed from 0. Select the
    ONE best answer strictly on correctness and faithfulness to the task; do not reward
    fluency, confidence, or verbosity, and do not average or merge answers.

    Output requirements:
    - Respond with a SINGLE JSON object and NOTHING else (no prose, no code fences).
    - Conform exactly to this schema:
      {
        "winner_index": <integer index of the chosen candidate>,
        "justification": <string, <= 60 words>
      }

    Task:
    {task_prompt}

    Candidate answers (indexed):
    {answers_json}
  judge_output_schema:
    is_correct: boolean
    error_category: one of {factual,reasoning,arithmetic,instruction,code,hallucination,incompleteness,safety}
      OR null if is_correct
    confidence: number in [0,1]
    justification: string, <= 60 words
  solver_json_schema:
    thesis: string (one-line conclusion)
    reasoning: string (chain of reasoning)
    python_code: string OR null (complete runnable code; null if not a code task)
    confidence: number in [0,1] (self-reported)
  fusion_judge_output_schema:
    winner_index: int
    justification: string, <= 60 words
raw_data_structures:
  model_answer:
    container_type: list[dict] (accumulated; materialized as a pd.DataFrame)
    grain: one record per generation (per (model, task, replicate) when replicates persisted)
    schema:
    - task_id
    - model_id
    - answer
    - error
    - prompt_tokens
    - completion_tokens
    - latency_s
    - temperature
    - seed
    field_dtypes:
      task_id: '(logical str; pandas object/category) FK to task_record.task_id; the join key binding
        this generation to its task and ground truth. INVARIANT: must reference a held-out evaluation
        task, never a qualification-benchmark id (§3.4).'
      model_id: (logical str; pandas object/category) exact gateway identifier (resolved at runtime via
        /models), preserved verbatim so any drift is attributable to a NAMED model version.
      answer: (logical str; pandas object) the verbatim, UNNORMALIZED model output - the genuinely raw
        payload the adjudicator later scores (App. C.2). No parsing/cleaning at this stage; strings may
        be multi-KB.
      error: (logical Optional[str]; pandas object with None) transport/decoding error message (timeout,
        rate-limit, malformed stream), else None. INFRASTRUCTURE failure channel, kept distinct from a
        content failure (a downstream annotation). Non-null => row has no scorable answer => retry (max_retries=2)
        or record as failed; NEVER silently dropped.
      prompt_tokens: (logical int; pandas int64, or nullable Int64 if a failed call leaves it unknown)
        billed input tokens; combined with preprocessing.cost_per_token to derive cost_usd; feeds C(S)
        (Eqs. 3, 36).
      completion_tokens: (logical int; pandas int64/Int64) billed output tokens; identical cost-telemetry
        role to prompt_tokens.
      latency_s: (logical float; pandas float64) wall-clock seconds for THIS single call; feeds L(S) (Eqs.
        3, 37). Recorded per call because it depends on transient network/provider load.
      temperature: (logical float; pandas float64) the decoding temperature ACTUALLY used (provenance,
        not a choice made here); panel role = 0.20 per llm_settings. Documents the generation distribution.
      seed: (logical int; pandas int64) per-call decoding seed where the provider honors one (per-replicate
        seeds = replicate_seed_base + rep). Best-effort generation reproducibility; many endpoints do
        not guarantee seed determinism, part of why Tier-2 replicability is bounded (§13.3).
    invariants:
      task_id_held_out: task_id must reference a held-out evaluation task, never a qualification-benchmark
        id (§3.4).
      error_handling: error != None => no scorable answer; retry (max_retries=2) or record as failed;
        never silently drop.
      raw_text: answer is stored verbatim and unnormalized; no parsing/cleaning at this stage.
    structure_note: Field list mirrors the §10.2 analytic projection 'schemas.model_answer'. In practice
      these dicts accumulate into a list materialized as a DataFrame (one row per generation, or per (model,
      task, replicate) when replicates are persisted); this is the input to Stage-2 scoring.
    example:
      task_id: math_0007
      model_id: deepseek-v4-pro
      answer: 'The limit equals e. Proof: ...'
      error: null
      prompt_tokens: 812
      completion_tokens: 437
      latency_s: 2.41
      temperature: 0.2
      seed: 20260618
  candidate_solution:
    container_type: list[dict] (accumulated; materialized as a pd.DataFrame)
    grain: one record per (model, task) on the verifier-augmented path
    schema:
    - task_id
    - model_id
    - thesis
    - reasoning
    - python_code
    - confidence
    - error
    field_dtypes:
      task_id: (logical str; pandas object/category) FK to task_record; same held-out invariant as model_answer.
      model_id: (logical str; pandas object/category) exact gateway id, as in model_answer.
      thesis: (logical str; pandas object) the one-line conclusion / final-answer summary elicited by
        the solver prompt - the concise claim the verifier/judge evaluates.
      reasoning: (logical str; pandas object) the chain of reasoning, captured INSIDE the JSON (the solver
        prompt mandates reasoning live in this field, not outside it), supporting auditability and adjudication.
      python_code: (logical Optional[str]; pandas object with None) complete, runnable code for code-bearing
        tasks, else None. Executed in architecture.sandbox (timeout_s=5, network='disabled', fs='restricted')
        to ground correctness deterministically (§8.3); App. C.3 forbids placeholders, so a non-runnable
        value is a protocol violation.
      confidence: (logical float in [0,1]; pandas float64) self-reported calibrated confidence; the DETERMINISTIC
        TIE-BREAKER in verifier-augmented fusion (highest deterministic score wins; ties broken by confidence,
        §8.3). A replication should validate the [0,1] bound.
      error: (logical Optional[str]; pandas object with None) transport/decoding/SCHEMA-VALIDATION error,
        else None. Non-conforming JSON is rejected and re-requested under the strict-JSON discipline (App.
        C.3); a persistent failure is recorded here.
    invariants:
      reasoning_inside_json: reasoning must live inside the JSON object, not as free text outside it (App.
        C.3).
      code_runnable: python_code must be complete and runnable (no placeholders); it is sandbox-executed
        (§8.3).
      confidence_bound: confidence in [0,1]; used only as the deterministic tie-breaker in fusion (§8.3).
    structure_note: Field list mirrors the §10.2 analytic projection 'schemas.candidate_solution'. This
      path carries NO token/latency/seed fields of its own; for both fusion paths the cost/latency telemetry
      is ultimately consolidated into the outcomes tensor.
    example:
      task_id: code_0042
      model_id: kimi-k2.6
      thesis: Off-by-one in the loop bound.
      reasoning: The range stops at n-1, so ...
      python_code: 'def f(n): return sum(range(n+1))'
      confidence: 0.78
      error: null
  task_record:
    container_type: list[dict] (accumulated; materialized as a pd.DataFrame)
    grain: one record per evaluation item
    schema:
    - task_id
    - domain
    - subdomain
    - prompt
    - ground_truth
    - scoring_rule
    - difficulty
    - is_held_out
    field_dtypes:
      task_id: (logical str; pandas object/category) primary key of the task table; FK target for all
        generation and tensor rows. Stable and globally unique (and, for the two non-canonical domains,
        paired with a per-item content hash, §11.4).
      domain: (logical str; pandas object/category) coarse capability partition; allowed set {math, code,
        science, finance, long_context, planning, tool} (the §11.4 seven-domain suite). A partition key
        for stratified item sampling and per-domain reporting.
      subdomain: (logical str; pandas object/category) finer label (e.g., 'real_analysis') for stratified
        reporting within a domain.
      prompt: (logical str; pandas object) the exact task text presented IDENTICALLY to every panel model
        - a common stimulus is what makes complementarity measurable rather than confounded. May be very
        long for long-context tasks.
      ground_truth: '(logical Any; pandas object) the reference signal Z: an exact-answer string, a unit-test
        suite, a rubric key, or a numeric-tolerance target. HETEROGENEOUS type, interpreted according
        to scoring_rule; the object against which correctness (A_it) is adjudicated.'
      scoring_rule: (logical str; pandas object/category) selects the scoring path; allowed {exact_match,
        unit_tests, judge_rubric, numeric_tol}. Determines whether grounding is deterministic (unit_tests/numeric_tol/exact_match)
        or judge-based (judge_rubric), hence how strongly the label depends on the adjudicator (Limitation
        5, §15.1).
      difficulty: (logical str; pandas object/category) optional difficulty stratum (e.g., 'olympiad')
        supporting difficulty-stratified item sampling for the variance-reduction design (§6/§11.4).
      is_held_out: '(logical bool; pandas bool) MANDATORY INVARIANT: must be True. Enforces membership
        in the evaluation partition disjoint from development and qualification (Assumption A1; held_out_disjoint_check).
        A False here is a protocol violation that invalidates inference.'
    invariants:
      is_held_out_true: is_held_out must be True (eval disjoint from development/qualification; Assumption
        A1).
      common_stimulus: prompt is presented identically to every panel model.
      ground_truth_typing: ground_truth type is heterogeneous and is interpreted per scoring_rule.
      noncanonical_corpus_fixity: finance and long_context/agentic items must carry a content hash and
        be released as a frozen item set, else they are demoted to exploratory (§11.4).
    structure_note: 'Field list mirrors the §10.2 analytic projection ''schemas.task_record''. Corpus-fixity
      (§11.4): for the finance and long-context/agentic domains, each record must additionally carry a
      content hash and be released as a frozen item set, else those domains are demoted to exploratory
      and excluded from H1-H5.'
    example:
      task_id: math_0007
      domain: math
      subdomain: real_analysis
      prompt: Evaluate lim ...
      ground_truth: e
      scoring_rule: exact_match
      difficulty: olympiad
      is_held_out: true
  outcomes:
    container_type: pd.DataFrame
    grain: one row per (model, task, replicate); R=5
    schema:
    - task_id
    - model_id
    - rep
    - correct
    - e_reason
    - e_comp
    - e_halluc
    - e_ctx
    - e_plan
    - e_tool
    - e_safety
    - e_refusal
    - cost_usd
    - latency_s
    - provider_version
    - system_fingerprint
    - seed
    field_dtypes:
      task_id: (logical str; pandas object/category) FK to task_record; NEVER a qualification-benchmark
        id. Part of the composite primary key.
      model_id: (logical str; pandas object/category) exact gateway id; part of the composite primary
        key.
      rep: (logical int; pandas int64, range small => int8/int16 suffices) replicate index 0..R-1 (R=5).
        The axis that makes the generation-variance component sigma^2_gen (Eq. 20a) estimable and that
        the inner loop of the nested cluster bootstrap resamples (§11.8). Third member of the composite
        key (task_id, model_id, rep).
      correct: (logical int in {0,1}; pandas int8/uint8 or bool) the correctness indicator A_it. The SOLE
        input to the outcome-based information-gain estimator (Eqs. 9, 9a) and to the majority-vote simulated-fusion
        quality Q_maj (Eq. 3a). NaN only if the underlying call errored (then handle the row explicitly).
      e_reason: '(logical int in {0,1}; pandas int8/uint8) reasoning/logical-error flag (invalid inference
        from correct premises); component of the error vector E_it (Eq. 2); populates the covariance Sigma
        (Eq. 10). EXCLUSIVITY: an incorrect row has exactly one e_* = 1; a correct row has all e_* = 0.'
      e_comp: (logical int in {0,1}; pandas int8/uint8) computational/arithmetic-error flag (numeric or
        symbolic miscalculation). Same E_it/Sigma role, dtype, and exclusivity as e_reason.
      e_halluc: (logical int in {0,1}; pandas int8/uint8) hallucination/fabrication flag (invented citations,
        APIs, entities, data). Same role/dtype/exclusivity.
      e_ctx: (logical int in {0,1}; pandas int8/uint8) long-context-failure flag. Same role/dtype/exclusivity.
      e_plan: (logical int in {0,1}; pandas int8/uint8) planning-failure flag. Same role/dtype/exclusivity.
      e_tool: (logical int in {0,1}; pandas int8/uint8) tool-use-failure flag. Same role/dtype/exclusivity.
      e_safety: (logical int in {0,1}; pandas int8/uint8) safety/policy-error flag. Same role/dtype/exclusivity.
      e_refusal: (logical int in {0,1}; pandas int8/uint8) refusal/incompleteness flag (truncated/partial/dropped
        sub-questions). Same role/dtype/exclusivity. The eight e_* columns are the operational encoding
        of the error taxonomy (see the taxonomy caveat in structure_note).
      cost_usd: (logical float; pandas float64) per-call dollar cost = tokens x provider price; feeds
        C(S). A derived telemetry quantity, recorded as a raw per-row fact in the tensor.
      latency_s: (logical float; pandas float64) wall-clock latency for the call; feeds L(S).
      provider_version: (logical str; pandas object/category) provider's served-version string (e.g.,
        'deepseek-v4-pro@2026-06-01'), recorded on EVERY call so a version change is detectable, not silent
        (drift control, §15.1; drift_monitor.capture_provider_version).
      system_fingerprint: (logical str; pandas object/category) per-request fingerprint exposed by OpenAI-compatible
        gateways (e.g., 'fp_8a1c...'); a finer drift/reproducibility signal than the version string (drift_monitor.capture_system_fingerprint).
      seed: (logical int; pandas int64) per-call decoding seed where honored (varies by replicate, e.g.,
        20260618 -> 20260619).
    invariants:
      primary_key:
      - task_id
      - model_id
      - rep
      error_exclusivity: correct==1 => all e_* == 0; correct==0 => exactly one e_* == 1.
      canonicalization: sort by (task_id, model_id, rep); fixed column order; fixed float precision; SHA-256
        over canonical bytes (reproducibility.tensor_sha256). Tier-1 validity <=> regenerating that hash.
    structure_note: 'STRUCTURE-LEVEL SPECS. (1) Composite primary key (task_id, model_id, rep); one row
      is the atomic unit over which all estimators operate. (2) SCHEMA RECONCILIATION: the §10.2 analytic
      projection ''schemas.outcomes_columns'' lists 13 columns and OMITS rep plus the provenance triple
      (provider_version, system_fingerprint, seed); this released tensor (§9.2(d)) augments the core with
      those four. Treat §9.2(d) as the byte-level release schema and schemas.outcomes_columns as the estimator-facing
      projection. (3) TAXONOMY CAVEAT: the failure taxonomy is labelled differently across §3.3 (Eq. 2
      six base {math, code, fact, context, plan, tool}), the §3.3 eight-category refinement (base six
      + {safety, refusal}), the §9.2 tensor columns {reason, comp, halluc, ctx, plan, tool, safety, refusal},
      and the §11.5/App. C.2 rubric {factual, reasoning, arithmetic, instruction, code, hallucination,
      incompleteness, safety}; these are NOT verbatim-identical, and the eight e_* tensor columns are
      the BINDING machine-level contract that populates Sigma - fix one canonical category->column map
      and apply it consistently across adjudication and covariance estimation. (4) DTYPE ENGINEERING:
      store correct and the eight e_* as int8/uint8 (or bool); rep as int16; cost_usd/latency_s as float64;
      ids/version/fingerprint as category; if errored calls introduce NaN, switch the integer columns
      to nullable Int8/Int64 to preserve integer semantics.'
    example:
      columns:
      - task_id
      - model_id
      - rep
      - correct
      - e_reason
      - e_comp
      - e_halluc
      - e_ctx
      - e_plan
      - e_tool
      - e_safety
      - e_refusal
      - cost_usd
      - latency_s
      - provider_version
      - system_fingerprint
      - seed
      rows:
